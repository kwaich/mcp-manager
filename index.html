<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>MCP Server Manager</h1>
        
        <!-- Messages -->
        <div id="errorMessage" class="message error" style="display: none;"></div>
        <div id="successMessage" class="message success" style="display: none;"></div>
        
        <!-- Navigation -->
        <div class="tabs">
            <button class="tab active" onclick="showView('servers', this)">Servers</button>
            <button class="tab" onclick="showView('tools', this)">Tools</button>
        </div>

        <!-- Add Server Button -->
        <div class="add-server-section">
            <button class="add-server-button" onclick="showAddServerModal()">+ Add Server</button>
        </div>

        <!-- Servers View -->
        <div id="serversView" class="grid"></div>

        <!-- Removed Servers Section -->
        <div id="removedServersSection" class="removed-servers-section" style="display: none;">
            <div class="removed-header" onclick="toggleRemovedSection()">
                <span>Removed Servers</span>
                <span id="removedToggleIcon">▼</span>
            </div>
            <div id="removedServersContent" class="removed-content" style="display: none;">
                <div id="removedServersList" class="removed-list"></div>
            </div>
        </div>

        <!-- Tools View -->
        <div id="toolsView" style="display: none;"></div>

        <!-- Save Button -->
        <button class="save-button" onclick="saveChanges()">Save Changes</button>

        <!-- Add/Edit Server Modal -->
        <div id="serverModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Add Server</h2>
                    <button class="modal-close" onclick="hideAddServerModal()">&times;</button>
                </div>
                <form id="serverForm" onsubmit="saveServer(event)">
                    <input type="hidden" id="editingServerName" value="">
                    
                    <div class="form-group">
                        <label for="serverName">Server Name *</label>
                        <input type="text" id="serverName" required placeholder="e.g., my-custom-server">
                    </div>
                    
                    <div class="form-group">
                        <label for="serverCommand">Command *</label>
                        <input type="text" id="serverCommand" required placeholder="e.g., node, python, npx">
                    </div>
                    
                    <div class="form-group">
                        <label for="serverArgs">Arguments (one per line)</label>
                        <textarea id="serverArgs" rows="4" placeholder="/path/to/server.js&#10;--flag&#10;--option value"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Environment Variables</label>
                        <div id="envVarsContainer"></div>
                        <button type="button" class="add-env-button" onclick="addEnvVarField()">+ Add Environment Variable</button>
                    </div>
                    
                    <div class="modal-actions">
                        <button type="button" class="cancel-button" onclick="hideAddServerModal()">Cancel</button>
                        <button type="submit" class="save-server-button">Save Server</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
